<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #00ffcc;
        }
        .game-box {
            background-color: #2a2a2a;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <h1>🎮 나의 게임 허브 (Game Hub)</h1>
    <p>환영합니다! 이곳은 제가 만든 게임들을 모아둔 공간입니다.</p>
    
    <div class="game-box">
        <h3>준비 중인 게임</h3>
        <p>재미있는 미니게임들이 곧 업데이트됩니다!</p>
    </div>
</body>
</html>
